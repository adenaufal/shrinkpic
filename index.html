<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ImageCompress — Free Private Image Compressor</title>
    <meta
      name="description"
      content="Compress JPG, PNG, WebP and AVIF images in your browser. Nothing is uploaded — every file is processed on your own device. Free, no signup, works offline."
    />
    <link rel="canonical" href="https://imgcmprs.netlify.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Browser chrome matches the active theme -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="ImageCompress" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ImageCompress" />
    <meta property="og:url" content="https://imgcmprs.netlify.app/" />
    <meta property="og:title" content="ImageCompress — Free Private Image Compressor" />
    <meta
      property="og:description"
      content="Compress images in your browser. Nothing ever leaves your device — no uploads, no accounts, no tracking."
    />
    <meta property="og:image" content="https://imgcmprs.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ImageCompress — compress images in your browser, nothing ever leaves your device" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ImageCompress — Free Private Image Compressor" />
    <meta
      name="twitter:description"
      content="Compress images in your browser. Nothing ever leaves your device — no uploads, no accounts, no tracking."
    />
    <meta name="twitter:image" content="https://imgcmprs.netlify.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ImageCompress",
        "url": "https://imgcmprs.netlify.app/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any modern web browser",
        "description": "Compress JPG, PNG, WebP and AVIF images entirely in your browser. Files are never uploaded to a server.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT"
      }
    </script>

    <script>
      // Applied before first paint so dark-mode users never see a white flash.
      // Mirrors the resolution order in src/contexts/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage or matchMedia unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
